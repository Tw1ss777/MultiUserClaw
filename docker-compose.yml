# OpenClaw Multi-Tenant Deployment
#
# Architecture:
#   frontend (public:3000) → gateway (internal+external) → per-user containers (internal only)
#                                  ↕
#                            postgres (internal)
#
# User containers are created dynamically by the gateway via Docker API,
# NOT defined in this compose file.

services:
  postgres:
    image: postgres:16-alpine
    container_name: openclaw-postgres
    restart: unless-stopped
    # 连接池放大后必须同步抬高 PG 上限：workers(4) × pool_size(200) = 800，预留 100
    # idle_in_transaction_session_timeout: 60s 强制释放卡死的事务内空闲连接（回收连接池）
    command: ["postgres", "-c", "max_connections=900", "-c", "idle_in_transaction_session_timeout=60000"]
    environment:
      POSTGRES_USER: nanobot
      POSTGRES_PASSWORD: nanobot
      POSTGRES_DB: nanobot_platform
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - openclaw-internal

  gateway:
    image: openclaw_gateway:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PLATFORM_DATABASE_URL: "postgresql+asyncpg://nanobot:nanobot@postgres:5432/nanobot_platform"
      PLATFORM_AIHUB_BASE_URL: "http://172.20.10.2:3000/agents/hub_api"
      PLATFORM_DEDICATED_RUNTIME_BACKEND: "hermes"
      PLATFORM_LITELLM_BASE_URL: "http://172.20.10.2:4000"
      PLATFORM_LITELLM_API_KEY: ""
      PLATFORM_LITELLM_MODELS: '[{"id": "qwen3.7-plus", "name": "qwen3.7-plus"},{"id":"qwen-max","name":"通义千问Max"}]'
      PLATFORM_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # SSO: ai-hub verify endpoint (host.docker.internal 指向宿主机)

      # 启动时自动创建管理员账号
      PLATFORM_ADMIN_USERNAME: "admin"
      PLATFORM_ADMIN_PASSWORD: "admin123"

      PLATFORM_OPENCLAW_IMAGE: ${PLATFORM_OPENCLAW_IMAGE:-openclaw:latest}
      PLATFORM_HERMES_IMAGE: ${PLATFORM_HERMES_IMAGE:-nanobot-hermes-agent:latest}
      PLATFORM_DEDICATED_RUNTIME_BACKEND: ${PLATFORM_DEDICATED_RUNTIME_BACKEND:-hermes}
      PLATFORM_CONTAINER_NETWORK: openclaw-internal
      PLATFORM_SHARED_OPENCLAW_ENABLED: ${PLATFORM_SHARED_OPENCLAW_ENABLED:-true}
      PLATFORM_SHARED_RUNTIME_BACKEND: ${PLATFORM_SHARED_RUNTIME_BACKEND:-hermes}
      PLATFORM_SHARED_OPENCLAW_URL: ${PLATFORM_SHARED_OPENCLAW_URL:-http://shared-openclaw:8080}
      PLATFORM_SHARED_HERMES_URL: ${PLATFORM_SHARED_HERMES_URL:-http://shared-openclaw:8080}
      PLATFORM_SHARED_HERMES_API_KEY: ${PLATFORM_SHARED_HERMES_API_KEY:-dev-hermes-bridge-key}
      PLATFORM_SHARED_OPENCLAW_SYSTEM_TOKEN: ${PLATFORM_SHARED_OPENCLAW_SYSTEM_TOKEN:-shared-openclaw-system-token}
      PLATFORM_CONTAINER_TZ: ${CONTAINER_TZ:-Asia/Shanghai}
      PLATFORM_CONTAINER_MEMORY_LIMIT: ${PLATFORM_CONTAINER_MEMORY_LIMIT:-2g}
      PLATFORM_CONTAINER_SHM_SIZE: ${PLATFORM_CONTAINER_SHM_SIZE:-1g}
      # 邮件通知（定时任务完成提醒），.env 中 SMTP_* 配置
      PLATFORM_ENABLE_EMAIL_NOTIFICATION: ${ENABLE_EMAIL_NOTIFICATION:-false}
      # DB 连接池（每 worker 一份）：总连接 = workers(4) × (POOL_SIZE + MAX_OVERFLOW)
      PLATFORM_DB_POOL_SIZE: "200"
      PLATFORM_DB_MAX_OVERFLOW: "0"
      PLATFORM_DB_POOL_TIMEOUT: "60"
      PLATFORM_SMTP_HOST: ${SMTP_HOST:-}
      PLATFORM_SMTP_PORT: ${SMTP_PORT:-465}
      PLATFORM_SMTP_USER: ${SMTP_USER:-}
      PLATFORM_SMTP_PASS: ${SMTP_PASS:-}
      PLATFORM_SMTP_FROM: ${SMTP_FROM:-}
      PLATFORM_SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      # 收件人覆盖：配了则所有通知邮件统一发给他，不配走任务主人邮箱
      PLATFORM_NOTIFY_OVERRIDE_EMAIL: ${NOTIFY_OVERRIDE_EMAIL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker API access for container management
      - ./.hermes/benchmarks:/app/.hermes/benchmarks:ro
      - ./.hermes/training_traces:/app/.hermes/training_traces
#      - ./deploy_copy/ssh:/root/.ssh:ro  # SSH key for private Git repos (skills marketplace)
    networks:
      - openclaw-internal   # talk to postgres + user containers
      - openclaw-external   # accept traffic from frontend / public

  frontend:
    image: openclaw_frontend:latest
    container_name: openclaw-frontend
    restart: unless-stopped
    ports:
      - "3080:3000"
    networks:
      - openclaw-external

  manage-front:
    image: openclaw_manage-front:latest
    container_name: openclaw-manage
    restart: unless-stopped
    ports:
      - "3081:3000"
    environment:
      - API_URL=http://gateway:8080
    networks:
      - openclaw-external



  simple-front:
    image: openclaw_simple-front:latest
    container_name: openclaw-simple
    restart: unless-stopped
    ports:
      - "3082:3000"
    networks:
      - openclaw-external
volumes:
  pgdata:

networks:
  openclaw-internal:
    name: openclaw-internal
    driver: bridge
  openclaw-external:
    name: openclaw-external
    driver: bridge


