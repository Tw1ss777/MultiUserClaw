server {
    listen 3000;
    server_name _;

    # 重定向用相对路径，避免被拼成容器内部端口 3000
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # 上传文件大小限制（默认 1m 太小）
    client_max_body_size 1024m;

    # API reverse proxy → gateway container
    location /api/ {
        proxy_pass http://openclaw-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for SSE streaming (AI responses)
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # 子路径部署（vite base: /agents/grzs/）：API 请求剥掉前缀后转发 gateway
    location /agents/grzs/api/ {
        rewrite ^/agents/grzs(/api/.*)$ $1 break;
        proxy_pass http://openclaw-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # 子路径部署：静态资源 + SPA fallback（alias 映射到平铺的 dist 根目录）
    location ^~ /agents/grzs/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /agents/grzs/index.html;

        # 带哈希的构建产物长缓存
        location ~* ^/agents/grzs/(assets/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot))$ {
            alias /usr/share/nginx/html/$1;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 根路径直接跳转到子路径应用入口
    location = / {
        return 302 /agents/grzs/;
    }

    # SPA fallback: all non-file routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
